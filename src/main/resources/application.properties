spring.application.name=binance-price-service
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.config.import=optional:file:.env[.properties]

binance.symbol=BNBUSDT
binance.base-url=https://api.binance.com
binance.poll-interval=${BINANCE_POLL_INTERVAL:PT30S}
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=5s